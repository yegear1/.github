name: Bug Report
description: Report a reproducible bug or unexpected behavior
title: "fix: "
labels: ["bug"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight Checklist
      description: Please verify the following before submitting your report.
      options:
        - label: I have searched existing open and closed issues to ensure this bug has not already been reported.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Minimal, step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Run command '...'
        2. Pass arguments '...'
        3. Observe error '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, version/commit hash, and runtime version.
      placeholder: "e.g., Ubuntu 24.04, v1.2.0, Python 3.12 / Node 22"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Output / Logs
      description: Paste relevant stack traces or terminal output here.
      render: shell
    validations:
      required: false
